# 部署位置：/www/server/panel/vhost/nginx/extension/gallery.haoliangjun.com/bucket-proxy.conf
# soloGallery 图片走 nginx 反代 MinIO（2026-09-30 域名切换）：
# 站点 https 化后浏览器拒绝 http://IP:9000 混合内容图片，MinIO 公共读对象
# 改经同域 /bucket/ 前缀转发（MINIO_PUBLIC_BASE_URL 指向此处，CSP 落在 self）
location /bucket/ {
    # 2026-10-19 防盗链：空 Referer（浏览器直开/微信内嵌）与自家域名放行，
    # 外站 <img> 热链 403。vividDeck 桌面端拉图走 9000 S3 直连不经这里，天然不受影响。
    # 上线后若发现自家分享渠道被误伤（403 集中出现），按 Referer 追加白名单域名。
    valid_referers none blocked server_names *.haoliangjun.com;
    if ($invalid_referer) {
        return 403;
    }
    # 图片限速宽于全站：网格页一次并发拉几十张 srcset 变体，burst 要给足
    # （2026-10-21 实测真实浏览单秒 60+ 图片请求，burst 40 误伤，放宽到 100）
    limit_req zone=sologallery_images burst=100 nodelay;
    proxy_pass http://127.0.0.1:9000/;
    proxy_set_header Host 127.0.0.1:9000;
    proxy_http_version 1.1;
}
