# 部署位置：/www/server/panel/vhost/nginx/0.sologallery-ratelimit.conf
# 宝塔 nginx 的 http 块按 nginx.conf:104 include /www/server/panel/vhost/nginx/*.conf，
# 0. 前缀保证先于站点 server 块加载（与既有 0.default.conf 等基础设施文件同模式）。
# limit_req_zone 只能定义在 http 上下文，引用在 gallery vhost 的 extension 片段里。
# vividDeck 桌面端 S3 直连 9000 不经 nginx，不受这些限速影响。
limit_req_zone $binary_remote_addr zone=sologallery_general:15m rate=15r/s;
limit_req_zone $binary_remote_addr zone=sologallery_images:10m rate=15r/s;
limit_req_status 429;
