# 部署位置：/www/server/panel/vhost/nginx/extension/gallery.haoliangjun.com/antibot.conf
# 服务器块级 include（主 vhost gallery.haoliangjun.com.conf 第 13 行），随 bucket-proxy.conf 一起加载。
# 2026-10-19 起因：GPTBot（74.7.241.63）单 IP 15.7 万次穷举筛选组合 URL；
# meta-externalagent（57.141.18.0/24）全段扫站。与 src/app/robots.ts 的声明式拒绝
# 互为双保险——robots 对遵守者生效，UA 拦截立即生效。
# UA 名单与 robots.ts 的 deniedAgents 保持同步；正则须写完整 token，
# Applebot-Extended 不会误伤搜索爬虫 Applebot。含空格的 token 要求整个正则加引号。
#
# 2026-10-21 修订：
# - /robots.txt 必须放行。此前 UA 拦截连 robots.txt 一起断连，GPTBot 换 IP 后
#   继续跑囤积队列（日均 4300 次 444）——它读不到 Disallow 就不知道该停。
#   遵守 robots 的爬虫读到 Disallow: / 后会彻底停止，连门都不来敲。
# - 移除 IP deny：两段都是自报 UA 的爬虫，UA 规则已覆盖且不随 IP 漂移；
#   deny 会把 robots.txt 也 403，RFC 9309 下 4xx 等于 allow-all，适得其反。
#   deny 只留给不报 UA 的纯扫描器。
# - 新增 facebookexternalhit（Meta 借链接预览 UA 爬站，日均 260 次 200）与
#   常见扫描器 UA。代价：Facebook/Instagram/Messenger 分享无预览卡片，可接受。
set $bot_block 0;
if ($http_user_agent ~* "(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-User|Claude-SearchBot|CCBot|Bytespider|meta-externalagent|facebookexternalhit|Amazonbot|Applebot-Extended|ImagesiftBot|PerplexityBot|Diffbot|Palo Alto Networks|zgrab|masscan|Nikto|sqlmap)") {
    set $bot_block 1;
}
if ($uri = /robots.txt) {
    set $bot_block 0;
}
if ($bot_block = 1) {
    return 444;
}

# 全站按 IP 限速；超发返回 429（limit_req_status 见 0.sologallery-ratelimit.conf）。
# 本 vhost 的 location ^~ / 把 HTML+静态+API 全部代理到 3000。
# 2026-10-21 实测：真实浏览网格页时 Next.js 链接预取 + 页面资源单秒可达 60+ 请求，
# 原 15r/s burst30 误伤真实访客（自家 IP 118 个 429），放宽到 30r/s burst80。
# 限流目标是拦百级/秒的病态突发，不是整形正常浏览；已识别爬虫由 UA 规则处理。
limit_req zone=sologallery_general burst=80 nodelay;
