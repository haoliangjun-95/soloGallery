# 部署位置：/www/server/panel/vhost/nginx/extension/gallery.haoliangjun.com/antibot.conf
# 服务器块级 include（主 vhost gallery.haoliangjun.com.conf 第 13 行），随 bucket-proxy.conf 一起加载。
# 2026-10-19 起因：GPTBot（74.7.241.63）单 IP 15.7 万次穷举筛选组合 URL；
# meta-externalagent（57.141.18.0/24）全段扫站。与 src/app/robots.ts 的声明式拒绝
# 互为双保险——robots 对遵守者生效（最长 24h 生效延迟），UA 拦截立即生效。
# UA 名单与 robots.ts 的 deniedAgents 保持同步；正则须写完整 token，
# Applebot-Extended 不会误伤搜索爬虫 Applebot。
if ($http_user_agent ~* (GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-User|Claude-SearchBot|CCBot|Bytespider|meta-externalagent|Amazonbot|Applebot-Extended|ImagesiftBot|PerplexityBot|Diffbot)) {
    return 444;
}

# 观测到的爬虫源段（UA 之外的第二道保险，防换段重访）
deny 74.7.241.63;    # OpenAI GPTBot
deny 57.141.18.0/24; # Meta meta-externalagent

# 全站按 IP 限速；超发返回 429（limit_req_status 见 0.sologallery-ratelimit.conf）。
# 本 vhost 的 location ^~ / 把 HTML+静态+API 全部代理到 3000，浏览器一页
# 突发可达 ~25 请求，burst 给到 30 防误伤
limit_req zone=sologallery_general burst=30 nodelay;
